<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Загрузка заклинания — Spellbook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #11121a;
            color: #ececf3;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 720px;
            margin: auto;
            padding: 32px 24px;
        }

        a {
            color: #c4b5fd;
        }

        h1 {
            margin-top: 28px;
        }

        p {
            color: #b6b7cb;
            line-height: 1.6;
        }

        form {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #36374d;
            border-radius: 16px;
            background: #1c1d2a;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        input[type="file"] {
            width: 100%;
            font: inherit;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            background: #c4b5fd;
            color: #21163c;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #ddd6fe;
        }

        .errorlist {
            color: #fca5a5;
        }

        :focus-visible {
            outline: 3px solid #e9d5ff;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <a href="{% url 'my_spell_list_page' %}">← Мои заклинания</a>

        <h1>Загрузить заклинание</h1>

        <p>
            Выбери JSON-файл одного заклинания.
            После загрузки проверь данные в форме.
            Заклинание появится в твоём списке после сохранения.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.non_field_errors }}
            {{ form.json_file.errors }}

            <label for="{{ form.json_file.id_for_label }}">
                {{ form.json_file.label }}
            </label>

            {{ form.json_file }}

            <p>{{ form.json_file.help_text }}</p>

            <button type="submit">Загрузить и проверить</button>
        </form>
    </main>
</body>
</html>
