name: spellbook

x-app: &app
  image: spellbook-local:latest
  build: .
  user: "${SPELLBOOK_UID:-1000}:${SPELLBOOK_GID:-1000}"
  environment:
    DJANGO_SETTINGS_MODULE: dnd_site.docker_settings
    SPELLBOOK_DATA_DIR: /data
    SPELLBOOK_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
  volumes:
    # Для SQLite монтируется каталог: журнал транзакций должен быть общим с базой.
    - type: bind
      source: .
      target: /data
  restart: unless-stopped
  stop_grace_period: 30s

services:
  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  reminders:
    <<: *app
    command: ["python", "docker/reminder_worker.py"]
    depends_on:
      web:
        condition: service_healthy

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: .
        target: /data
        read_only: true
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
