<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удаление персонажа — Spellbook</title>
    <style>
        body {
            margin: 0;
            background: #11121a;
            color: #f3f4f6;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 600px;
            margin: 60px auto;
            padding: 24px;
        }

        .panel {
            padding: 28px;
            background: #1c1d2a;
            border: 1px solid #343548;
            border-radius: 16px;
        }

        p {
            line-height: 1.6;
        }

        .warning {
            color: #fca5a5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 24px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #b91c1c;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #991b1b;
        }

        a {
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <main>
        <div class="panel">
            <h1>Удалить персонажа?</h1>

            <p>
                Ты собираешься удалить персонажа
                <strong>«{{ character.name }}»</strong>.
            </p>

            <p class="warning">
                Вместе с персонажем будут удалены все его спеллбуки.
                Отменить это действие нельзя.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="actions">
                    <button type="submit">Удалить персонажа</button>
                    <a href="{% url 'character_list_page' %}">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
