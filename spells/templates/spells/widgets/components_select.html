<details class="component-filter" data-component-filter>
<summary aria-label="Выбрать компоненты"><span data-component-summary>{{ widget.selected_labels|default:'Любые компоненты' }}</span><span aria-hidden="true">▾</span></summary>
<div class="component-filter-options" role="group" aria-label="Компоненты">

</div>
</details>
