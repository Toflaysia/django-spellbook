<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% if editing %}Редактировать{% else %}Создать{% endif %}
        персонажа — Spellbook
    </title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #11121a;
            color: #ececf3;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 28px 20px;
        }

        a { color: #c4b5fd; }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin: 28px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #45465f;
            border-radius: 8px;
            background: #1d1e2b;
            color: #fff;
            font: inherit;
        }

        button {
            padding: 14px 24px;
            border: 0;
            border-radius: 10px;
            background: #c4b5fd;
            color: #21163c;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .errorlist {
            padding-left: 20px;
            color: #fda4af;
        }

        .help {
            color: #b6b7cb;
            font-size: 14px;
        }

        :focus-visible {
            outline: 3px solid #e9d5ff;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .fields { grid-template-columns: 1fr; }
        }
                input[type="checkbox"] {
            width: auto;
            accent-color: #c4b5fd;
        }
    </style>
</head>
<body>
    <main>
        <a href="{% url 'character_list_page' %}">← Мои персонажи</a>
        <h1>
            {% if editing %}Редактировать персонажа{% else %}Создать персонажа{% endif %}
        </h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="fields">
                {% for field in form %}
                    <div>
                        {{ field.label_tag }}
                        {{ field }}
                        {{ field.errors }}

                        {% if field.help_text %}
                            <p class="help">{{ field.help_text }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <button type="submit">
                {% if editing %}Сохранить изменения{% else %}Создать персонажа{% endif %}
            </button>
        </form>
    </main>
</body>
</html>
