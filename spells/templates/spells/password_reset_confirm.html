{% extends "spells/auth_base.html" %}
{% block auth_page_title %}Новый пароль{% endblock %}
{% block auth_content %}<h1>Новый пароль</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Сохранить пароль</button></form>{% else %}<p>Ссылка недействительна или уже использована.</p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a>{% endif %}{% endblock %}
