<style>
    .description-editor {
        border: 1px solid #484960;
        border-radius: 10px;
        background: #11121a;
    }

    .description-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-bottom: 1px solid #343548;
    }

    .description-dropdown {
        position: relative;
    }

    body .description-editor .description-toggle {
        width: 40px;
        min-height: 40px;
        padding: 0;
        background: #252637;
        color: #ddd6fe;
        border: 1px solid #484960;
        font-size: 22px;
    }

    .description-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 10;
        min-width: 150px;
        padding: 6px;
        border: 1px solid #484960;
        border-radius: 10px;
        background: #252637;
        box-shadow: 0 8px 24px rgb(0 0 0 / 30%);
    }

    .description-editor [hidden] {
        display: none !important;
    }

    body .description-editor .description-small-button {
        min-height: 36px;
        padding: 7px 10px;
        border: 1px solid #484960;
        background: #252637;
        color: #ececf3;
        font-size: 13px;
    }

    body .description-editor .description-small-button:hover {
        background: #343047;
        color: #fff;
    }

    .description-blocks {
        display: grid;
        gap: 16px;
        padding: 14px;
    }

    .description-block {
        min-width: 0;
        padding: 12px;
        border: 1px solid #343548;
        border-radius: 8px;
    }

    .description-block-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
    }

    .description-block-title {
        margin-right: auto;
        color: #b8b9cc;
        font-size: 14px;
    }

    .description-editor textarea {
        display: block;
        width: 100%;
        min-height: 100px;
        padding: 10px;
        border: 1px solid #484960;
        border-radius: 6px;
        background: #191a25;
        color: #ececf3;
        font: inherit;
        resize: vertical;
    }

    .description-table-wrapper {
        overflow-x: auto;
    }

    .description-table {
        width: 100%;
        border-collapse: collapse;
    }

    .description-table td {
        min-width: 120px;
        padding: 4px;
        border: 1px solid #484960;
        vertical-align: top;
    }

    .description-table td textarea {
        min-height: 70px;
        border: none;
    }

    .description-table td:focus-within {
        background: #44365e;
    }

    .description-table-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }

    .description-editor-help {
        margin: 0;
        padding: 0 14px 14px;
        color: #b8b9cc;
        font-size: 13px;
    }
</style>

<script>
(() => {
    const prefix = 'SPELLBOOK_BLOCKS_V1:';

    function createElement(tag, className, text) {
        const element = document.createElement(tag);

        if (className) {
            element.className = className;
        }

        if (text !== undefined) {
            element.textContent = text;
        }

        return element;
    }

    function createButton(text, action) {
        const button = createElement(
            'button',
            'description-small-button',
            text
        );

        button.type = 'button';
        button.addEventListener('click', action);

        return button;
    }

    document.querySelectorAll(
        'textarea[data-description-editor]'
    ).forEach((source) => {
        let initialBlocks;

        try {
            if (source.value.startsWith(prefix)) {
                initialBlocks = JSON.parse(
                    source.value.slice(prefix.length)
                );

                if (!Array.isArray(initialBlocks)) {
                    return;
                }

                const valid = initialBlocks.every((block) => {
                    if (block?.type === 'text') {
                        return typeof block.text === 'string';
                    }

                    if (block?.type !== 'table') {
                        return false;
                    }

                    const rows = block.rows;

                    return (
                        Array.isArray(rows)
                        && rows.length >= 1
                        && rows.length <= 9
                        && Array.isArray(rows[0])
                        && rows[0].length >= 1
                        && rows[0].length <= 9
                        && rows.every((row) =>
                            Array.isArray(row)
                            && row.length === rows[0].length
                            && row.every((cell) =>
                                typeof cell === 'string'
                            )
                        )
                    );
                });

                if (!valid) {
                    return;
                }
            } else {
                initialBlocks = [
                    { type: 'text', text: source.value }
                ];
            }
        } catch {
            return;
        }

        const editor = createElement('div', 'description-editor');
        const toolbar = createElement('div', 'description-toolbar');
        const dropdown = createElement('div', 'description-dropdown');
        const toggle = createButton('▾', () => {
            menu.hidden = !menu.hidden;
            toggle.setAttribute(
                'aria-expanded',
                String(!menu.hidden)
            );

            if (!menu.hidden) {
                insertTable.focus();
            }
        });

        toggle.className = 'description-toggle';
        toggle.title = 'Добавить таблицу';
        toggle.setAttribute('aria-label', 'Добавить таблицу');
        toggle.setAttribute('aria-expanded', 'false');

        const menu = createElement('div', 'description-menu');
        menu.hidden = true;
        menu.id = `${source.id}-table-menu`;
        toggle.setAttribute('aria-controls', menu.id);

        const blocksContainer = createElement(
            'div',
            'description-blocks'
        );

        const records = new Map();

        function serialize() {
            const blocks = Array.from(
                blocksContainer.children
            ).map((element) => {
                const record = records.get(element);

                if (record.type === 'text') {
                    return {
                        type: 'text',
                        text: record.input.value,
                    };
                }

                return {
                    type: 'table',
                    rows: readRows(record.table),
                };
            });

            source.value = prefix + JSON.stringify(blocks);
        }

        function readRows(table) {
            return Array.from(table.rows).map((row) =>
                Array.from(row.cells).map((cell) =>
                    cell.querySelector('textarea').value
                )
            );
        }

        function addBlock(type, title) {
            const block = createElement(
                'div',
                'description-block'
            );

            const bar = createElement(
                'div',
                'description-block-toolbar'
            );

            bar.append(
                createElement(
                    'span',
                    'description-block-title',
                    title
                ),
                createButton('↑', () => {
                    if (block.previousElementSibling) {
                        blocksContainer.insertBefore(
                            block,
                            block.previousElementSibling
                        );
                        serialize();
                    }
                }),
                createButton('↓', () => {
                    if (block.nextElementSibling) {
                        blocksContainer.insertBefore(
                            block.nextElementSibling,
                            block
                        );
                        serialize();
                    }
                }),
                createButton('Удалить', () => {
                    records.delete(block);
                    block.remove();

                    if (!blocksContainer.children.length) {
                        addText('');
                    }

                    serialize();
                })
            );

            bar.querySelectorAll('button')[0].setAttribute(
                'aria-label',
                'Переместить блок выше'
            );

            bar.querySelectorAll('button')[1].setAttribute(
                'aria-label',
                'Переместить блок ниже'
            );

            block.append(bar);
            blocksContainer.append(block);
            records.set(block, { type });

            return block;
        }

        function addText(value = '') {
            const block = addBlock('text', 'Текст');
            const input = createElement('textarea');
            input.rows = 5;
            input.value = value;
            input.setAttribute('aria-label', 'Текст описания');

            block.append(input);
            records.get(block).input = input;

            return input;
        }

        function addTable(values) {
            const block = addBlock('table', 'Таблица');
            const wrapper = createElement(
                'div',
                'description-table-wrapper'
            );
            const table = createElement(
                'table',
                'description-table'
            );
            const body = document.createElement('tbody');
            const actions = createElement(
                'div',
                'description-table-actions'
            );

            table.append(body);
            wrapper.append(table);
            block.append(wrapper, actions);

            const record = records.get(block);
            record.table = table;

            let activeRow = 0;
            let activeColumn = 0;

            function makeCell(value) {
                const cell = document.createElement('td');
                const input = createElement('textarea');

                input.rows = 2;
                input.value = value;
                cell.append(input);

                input.addEventListener('focus', () => {
                    activeRow = cell.parentElement.rowIndex;
                    activeColumn = cell.cellIndex;
                });

                input.addEventListener('keydown', (event) => {
                    if (
                        event.key !== 'Tab'
                        || event.ctrlKey
                        || event.metaKey
                        || event.altKey
                    ) {
                        return;
                    }

                    const inputs = Array.from(
                        table.querySelectorAll('textarea')
                    );
                    const index = inputs.indexOf(input);

                    if (event.shiftKey) {
                        if (index > 0) {
                            event.preventDefault();
                            inputs[index - 1].focus();
                        }
                        return;
                    }

                    if (index < inputs.length - 1) {
                        event.preventDefault();
                        inputs[index + 1].focus();
                    } else if (table.rows.length < 9) {
                        event.preventDefault();
                        appendRow();
                        const lastRow = table.rows[
                            table.rows.length - 1
                        ];
                        lastRow.cells[0].querySelector(
                            'textarea'
                        ).focus();
                    }
                });

                return cell;
            }

            function appendRow() {
                if (table.rows.length >= 9) {
                    return;
                }

                const columnCount = table.rows[0].cells.length;
                const row = document.createElement('tr');

                for (let index = 0; index < columnCount; index++) {
                    row.append(makeCell(''));
                }

                body.append(row);
                updateControls();
                serialize();
            }

            function appendColumn() {
                if (table.rows[0].cells.length >= 9) {
                    return;
                }

                Array.from(table.rows).forEach((row) => {
                    row.append(makeCell(''));
                });

                updateControls();
                serialize();
            }

            function removeRow() {
                if (table.rows.length <= 1) {
                    return;
                }

                const index = Math.min(
                    activeRow,
                    table.rows.length - 1
                );
                table.deleteRow(index);
                activeRow = Math.min(
                    index,
                    table.rows.length - 1
                );

                updateControls();
                serialize();
            }

            function removeColumn() {
                if (table.rows[0].cells.length <= 1) {
                    return;
                }

                const index = Math.min(
                    activeColumn,
                    table.rows[0].cells.length - 1
                );

                Array.from(table.rows).forEach((row) => {
                    row.deleteCell(index);
                });

                activeColumn = Math.min(
                    index,
                    table.rows[0].cells.length - 1
                );

                updateControls();
                serialize();
            }

            const rowButton = createButton(
                '+ Строка',
                appendRow
            );
            const columnButton = createButton(
                '+ Столбец',
                appendColumn
            );
            const removeRowButton = createButton(
                'Удалить строку',
                removeRow
            );
            const removeColumnButton = createButton(
                'Удалить столбец',
                removeColumn
            );

            actions.append(
                rowButton,
                columnButton,
                removeRowButton,
                removeColumnButton
            );

            function updateControls() {
                const rowCount = table.rows.length;
                const columnCount = table.rows[0].cells.length;

                rowButton.disabled = rowCount >= 9;
                columnButton.disabled = columnCount >= 9;
                removeRowButton.disabled = rowCount <= 1;
                removeColumnButton.disabled = columnCount <= 1;

                Array.from(table.rows).forEach((row, rowIndex) => {
                    Array.from(row.cells).forEach(
                        (cell, columnIndex) => {
                            cell.querySelector('textarea').setAttribute(
                                'aria-label',
                                `Строка ${rowIndex + 1}, столбец ${columnIndex + 1}`
                            );
                        }
                    );
                });
            }

            values.forEach((valuesRow) => {
                const row = document.createElement('tr');

                valuesRow.forEach((value) => {
                    row.append(makeCell(value));
                });

                body.append(row);
            });

            updateControls();

            return table;
        }

        const insertTable = createButton('Таблица', () => {
            const table = addTable([
                ['', ''],
                ['', ''],
            ]);

            // Оставляем место для текста после таблицы.
            addText('');
            serialize();

            menu.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
            table.querySelector('textarea').focus();
        });

        menu.append(insertTable);
        dropdown.append(toggle, menu);
        toolbar.append(
            dropdown,
            createButton('+ Текст', () => {
                const input = addText('');
                serialize();
                input.focus();
            })
        );

        editor.append(
            toolbar,
            blocksContainer,
            createElement(
                'p',
                'description-editor-help',
                'Tab — следующая ячейка; в последней добавляет строку. '
                + 'Enter — перенос текста внутри ячейки. '
                + 'Максимальный размер таблицы — 9 × 9. '
                + 'Для удаления строки или столбца сначала выбери ячейку.'
            )
        );

        initialBlocks.forEach((block) => {
            if (block.type === 'text') {
                addText(block.text);
            } else {
                addTable(block.rows);
            }
        });

        if (!blocksContainer.children.length) {
            addText('');
        }

        source.after(editor);
        source.hidden = true;
        source.required = false;

        source.labels.forEach((label) => {
            label.addEventListener('click', (event) => {
                event.preventDefault();
                editor.querySelector('textarea').focus();
            });
        });

        editor.addEventListener('input', serialize);
        source.form.addEventListener('submit', serialize);

        document.addEventListener('click', (event) => {
            if (!dropdown.contains(event.target)) {
                menu.hidden = true;
                toggle.setAttribute('aria-expanded', 'false');
            }
        });

        dropdown.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                menu.hidden = true;
                toggle.setAttribute('aria-expanded', 'false');
                toggle.focus();
            }
        });
    });
})();
</script>
