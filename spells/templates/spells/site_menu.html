<style>
    .site-menu {
        position: relative;
    }

    .site-menu > summary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 6px 0;
        color: #c4b5fd;
        font-size: 24px;
        font-weight: 700;
        list-style: none;
        cursor: pointer;
    }

    .site-menu > summary::-webkit-details-marker {
        display: none;
    }

    .site-menu-arrow {
        font-size: 14px;
    }

    .site-menu[open] .site-menu-arrow {
        transform: rotate(180deg);
    }

    .site-menu-panel {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 100;
        width: min(720px, calc(100vw - 48px));
        max-height: 70vh;
        overflow-y: auto;
        padding: 24px;
        border: 1px solid #484960;
        border-radius: 16px;
        background: #1c1d2a;
        box-shadow: 0 16px 48px rgb(0 0 0 / 40%);
    }

    .site-menu-home {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
    }

    .site-menu-groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
    }

    .site-menu-group {
        min-width: 0;
    }

    .site-menu-group h2 {
        margin: 0 0 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #343548;
        color: #b8b9cc;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .site-menu-group a {
        display: block;
        padding: 9px 10px;
        border-radius: 8px;
        color: #ececf3;
        text-decoration: none;
        overflow-wrap: anywhere;
    }

    .site-menu-group a:hover {
        background: #302943;
        color: #ddd6fe;
    }

    @media (max-width: 600px) {
        .site-menu-panel {
            width: calc(100vw - 32px);
            padding: 20px;
        }

        .site-menu-groups {
            grid-template-columns: 1fr;
            gap: 20px;
        }
    }
</style>

<details class="site-menu" id="site-menu">
    <summary>
        Spellbook
        <span class="site-menu-arrow" aria-hidden="true">▾</span>
    </summary>

    <nav class="site-menu-panel" aria-label="Разделы сайта">
        <a class="site-menu-home" href="{% url 'home_page' %}">
            Главная
        </a>

        <div class="site-menu-groups">
            {% if request.user.is_authenticated %}
                <section class="site-menu-group">
                    <h2>Моя коллекция</h2>
                    <a href="{% url 'character_list_page' %}">
                        Мои персонажи
                    </a>
                    <a href="{% url 'my_spell_list_page' %}">
                        Мои заклинания
                    </a>
                    <a href="{% url 'spellbook_list_page' %}">
                        Мои спеллбуки
                    </a>
                </section>
            {% endif %}

            <section class="site-menu-group">
                <h2>Магия</h2>
                <a href="{% url 'spell_list_page' %}">
                    Официальные заклинания
                </a>
                <a href="{% url 'catalog_list_page' 'schools' %}">
                    Школы магии
                </a>
                <a href="{% url 'catalog_list_page' 'effects' %}">
                    Эффекты
                </a>
                <a href="{% url 'catalog_list_page' 'damage-types' %}">
                    Типы урона
                </a>
            </section>

            <section class="site-menu-group">
                <h2>Накладывание</h2>
                <a href="{% url 'catalog_list_page' 'components' %}">
                    Материальные компоненты
                </a>
                <a href="{% url 'catalog_list_page' 'casting-times' %}">
                    Время накладывания
                </a>
            </section>

            <section class="site-menu-group">
                <h2>Классы персонажей</h2>
                <a href="{% url 'catalog_list_page' 'classes' %}">
                    Классы
                </a>
            </section>
        </div>
    </nav>
</details>

<script>
    (() => {
        const menu = document.getElementById('site-menu');
        const toggle = menu.querySelector('summary');

        menu.addEventListener('pointerenter', (event) => {
            if (event.pointerType === 'mouse') {
                menu.open = true;
            }
        });

        menu.addEventListener('pointerleave', (event) => {
            if (
                event.pointerType === 'mouse'
                && !menu.contains(document.activeElement)
            ) {
                menu.open = false;
            }
        });

        menu.addEventListener('focusout', () => {
            requestAnimationFrame(() => {
                if (
                    !menu.contains(document.activeElement)
                    && !menu.matches(':hover')
                ) {
                    menu.open = false;
                }
            });
        });

        document.addEventListener('click', (event) => {
            if (!menu.contains(event.target)) {
                menu.open = false;
            }
        });

        menu.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                event.preventDefault();
                menu.open = false;
                toggle.focus();
            }
        });
    })();
</script>
