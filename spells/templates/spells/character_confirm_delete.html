<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удаление персонажа — Spellbook</title>
    <style>
        body {
            margin: 0;
            background: #11121a;
            color: #f3f4f6;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 600px;
            margin: 60px auto;
            padding: 24px;
        }

        .panel {
            padding: 28px;
            background: #1c1d2a;
            border: 1px solid #343548;
            border-radius: 16px;
        }

        p {
            line-height: 1.6;
        }

        .warning {
            color: #fca5a5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 24px;
        }

        button {
            padding: 12px 18px;
            border: 1px solid #754052;
            border-radius: 8px;
            background: #39232c;
            color: #fda4af;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4b2b37;
        }

        a {
            color: #c4b5fd;
        }
        * {
    box-sizing: border-box;
}

    .brand {
        color: #c4b5fd;
        font-size: 18px;
        font-weight: bold;
    }

    .page-title {
        margin: 12px 0 20px;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.2;
    }

    .cancel-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: 1px solid #45465f;
        border-radius: 8px;
        background: #292a3c;
        color: #ececf3;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
    }

    .cancel-button:hover {
        background: #35364b;
    }

    :focus-visible {
        outline: 3px solid #e9d5ff;
        outline-offset: 4px;
    }
    </style>
</head>
<body>
    <main>
        <div class="panel">
            <div class="brand">Spellbook</div>
            <h1 class="page-title">Удалить персонажа?</h1>
            <p>
                Ты собираешься удалить персонажа
                <strong>«{{ character.name }}»</strong>.
            </p>

            <p class="warning">
                Вместе с персонажем будут удалены все его спеллбуки.
                Отменить это действие нельзя.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="actions">
                    <button type="submit">Удалить персонажа</button>
                    <a class="cancel-button" href="{% url 'character_list_page' %}">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
